name: Build Android APK with Buildozer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev tcl-dev tk-dev libgdbm-dev libc6-dev libbz2-dev zlib1g-dev libssl-dev libffi-dev libgpm2 xclip xsel
        pip install --upgrade pip
        pip install --upgrade buildozer cython kivy plyer ffpyplayer

    - name: Build Android APK with Existing Spec
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: oisuvedit-app-debug
        path: bin/*.apk
