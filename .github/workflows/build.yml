name: Build Android APK with Buildozer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-${{ steps.get-date.outputs.date }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev tcl-dev tk-dev libgdbm-dev libc6-dev libbz2-dev zlib1g-dev libssl-dev libffi-dev libgpm2 xclip xsel
        pip install --upgrade pip
        pip install --upgrade buildozer cython kivy plyer ffpyplayer

    - name: Initialize Buildozer
      run: |
        yes | buildozer init
        sed -i 's/title = My Application/title = oisuvedit/g' buildozer.spec
        sed -i 's/package.name = myapp/package.name = oisuvedit/g' buildozer.spec
        sed -i 's/requirements = .*/requirements = kivy,plyer,ffpyplayer/g' buildozer.spec
        sed -i 's/#android.permissions = .*/android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE/g' buildozer.spec
        sed -i 's/#android.api = .*/android.api = 33/g' buildozer.spec

    - name: Build Android APK
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: oisuvedit-app-debug
        path: bin/*.apk
